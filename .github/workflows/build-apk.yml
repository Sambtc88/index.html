name: Build Barbarg Bandar Pay APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build Web App and APK
        run: |
          mkdir -p www
          cp index.html www/
          if [ -f logo.png ]; then cp logo.png www/; fi
          if [ -f manifest.json ]; then cp manifest.json www/; fi
          if [ -f sw.js ]; then cp sw.js www/; fi

          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          npx cap init "باربرگ بندر پی" "com.barbarg.bandarpay" --web-dir www
          npx cap add android

          cd android
          chmod +x gradlew
          # پاکسازی کش احتمالی و ساخت با اجازه دانلود یا حالت پایدار
          ./gradlew clean assembleDebug --no-daemon --refresh-dependencies || ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Barbarg-Bandar-Pay-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
