name: Build Barbarg Bandar Pay APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build Web App, Set Icon and Compile APK
        run: |
          mkdir -p www
          cp index.html www/
          if [ -f logo.png ]; then 
            cp logo.png www/
            cp logo.png android_icon.png || true
          fi
          if [ -f manifest.json ]; then cp manifest.json www/; fi
          if [ -f sw.js ]; then cp sw.js www/; fi

          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          npx cap init "باربرگ بندر پی" "com.barbarg.bandarpay" --web-dir www
          npx cap add android

          # قرار دادن تصویر لوگو به عنوان آیکون اصلی پروژه اندروید
          if [ -f logo.png ]; then
            mkdir -p android/app/src/main/res/mipmap-xxxhdpi/
            cp logo.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            cp logo.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
            cp logo.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
          fi

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Barbarg-Bandar-Pay-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
